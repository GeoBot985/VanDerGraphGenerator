[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-visual-builder"
version = "0.12.0"
description = "Local semantic visual programming scaffold"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.5",
    "pandas>=2.3.3",
    "Pillow>=11.3.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.5",
    "black>=23.0",
    "mypy>=2.1.0",
    "pyinstaller>=6.19.0",
    "playwright>=1.55.0",
]
export = [
    "playwright>=1.55.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

# Pillow ships imprecise stubs for Image.quantize/getcolors/getpalette/getpixel
# (e.g. returning ImagingCore, or float|tuple unions). The palette extractor is
# runtime-correct against real RGB images, so the stub-driven type errors are
# silenced here rather than papered over inline.
[[tool.mypy.overrides]]
module = "semantic_visual_builder.image_style.palette_extractor"
disable_error_code = ["arg-type", "attr-defined", "operator", "list-item"]
