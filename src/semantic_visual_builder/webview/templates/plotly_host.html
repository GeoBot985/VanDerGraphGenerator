<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Van Der Graph Generator Preview</title>
  <!-- TODO: bundle local JS assets for offline packaging in a later sprint. -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div id="chart" style="width:100%;height:90vh;"></div>
  <script>
    const config = {{PLOTLY_CONFIG_JSON}};
    Plotly.newPlot("chart", config.data, config.layout, {responsive: true});
  </script>
</body>
</html>
